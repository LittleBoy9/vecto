<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.3"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08080c"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- mark -->
  <g transform="translate(90,84)">
    <rect width="86" height="86" rx="22" fill="url(#mark)"/>
    <path d="M24 28 L43 58 L62 28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="28" r="4.6" fill="#fff"/><circle cx="62" cy="28" r="4.6" fill="#fff"/>
  </g>
  <text x="196" y="142" fill="#ededf2" font-size="34" font-weight="700" letter-spacing="9">VECTO</text>

  <!-- headline -->
  <text x="88" y="320" fill="#ffffff" font-size="92" font-weight="700" letter-spacing="-3">Design at the</text>
  <text x="88" y="416" fill="url(#txt)" font-size="92" font-weight="700" letter-spacing="-3">speed of thought.</text>

  <!-- sub -->
  <text x="90" y="488" fill="#8a8a99" font-size="30">An AI-native vector studio — generate, trace &amp; edit SVG.</text>

  <!-- feature pills -->
  <g fill="#9aa0ad" font-size="24" font-weight="500">
    <text x="90" y="566">AI Generate</text>
    <text x="290" y="566" fill="#0ea5e9">✦</text>
    <text x="322" y="566">Image → Vector</text>
    <text x="556" y="566" fill="#0ea5e9">✦</text>
    <text x="588" y="566">Node Editing</text>
    <text x="788" y="566" fill="#0ea5e9">✦</text>
    <text x="820" y="566">Boolean &amp; Gradients</text>
  </g>
</svg>
